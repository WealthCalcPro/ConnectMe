<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectMe Pro - Zoom Layout</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase App & Database -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <!-- PeerJS for WebRTC Video/Audio -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        @keyframes floatUp {
            0% { transform: translateY(0px) scale(0.8); opacity: 1; }
            100% { transform: translateY(-180px) scale(1.4); opacity: 0; }
        }
        .floating-emoji {
            animation: floatUp 2s ease-out forwards;
            pointer-events: none;
            position: absolute;
            bottom: 80px;
            z-index: 60;
            font-size: 2rem;
        }
        .blur-bg {
            filter: blur(12px);
            transform: scale(1.1);
        }
    </style>
</head>
<body id="app-body" class="bg-slate-950 text-slate-100 h-screen w-screen overflow-hidden flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 -translate-y-20 transition-transform duration-300 bg-slate-800 border border-slate-700 text-white text-xs px-4 py-2.5 rounded-full shadow-2xl z-50 flex items-center gap-2">
        <span id="toast-msg">Link copied!</span>
    </div>

    <!-- ================= 1. HOME / JOIN SCREEN ================= -->
    <div id="home-screen" class="flex-1 flex items-center justify-center p-4">
        <div id="home-card" class="bg-slate-900 border border-slate-800 rounded-3xl max-w-sm w-full p-8 shadow-2xl">
            <div class="text-center mb-6">
                <div class="w-14 h-14 bg-indigo-600/20 text-indigo-400 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-3 border border-indigo-500/30">📹</div>
                <h1 class="text-xl font-bold tracking-tight">ConnectMe Zoom</h1>
                <p class="text-xs text-slate-400 mt-1">Professional Video Layout</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Your Name</label>
                    <input type="text" id="user-name-input" placeholder="e.g. Rahul" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-100">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Room Code</label>
                    <input type="text" id="room-code-input" placeholder="e.g. meeting-101" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-100 uppercase tracking-wider font-mono">
                </div>
                <button onclick="joinRoom()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl py-3 text-sm transition shadow-lg shadow-indigo-600/20">
                    Join Meeting
                </button>
            </div>
        </div>
    </div>

    <!-- ================= 2. ZOOM STYLE CALL SCREEN ================= -->
    <div id="call-screen" class="hidden flex-1 relative w-full h-full overflow-hidden flex flex-col bg-slate-950">
        
        <!-- Top Header Overlay (Zoom Style) -->
        <div class="absolute top-0 left-0 right-0 p-3 flex justify-between items-center z-30 bg-gradient-to-b from-slate-950/80 to-transparent pointer-events-none">
            <div class="flex items-center gap-2 pointer-events-auto bg-slate-900/60 backdrop-blur-md border border-slate-800 px-3 py-1.5 rounded-full">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="display-room-title" class="font-semibold text-xs text-slate-200">Room: --</span>
                <span class="text-slate-600">|</span>
                <span id="call-timer" class="text-xs text-slate-400 font-mono">00:00</span>
            </div>
            
            <div class="flex items-center gap-2 pointer-events-auto">
                <span id="recording-badge" class="hidden bg-red-500/20 text-red-400 border border-red-500/30 text-[10px] px-2 py-0.5 rounded-full font-medium animate-pulse">🔴 REC</span>
                <button onclick="toggleTheme()" id="theme-btn" class="bg-slate-900/60 hover:bg-slate-800 border border-slate-800 text-slate-300 w-8 h-8 rounded-full flex items-center justify-center text-xs transition">🌙</button>
            </div>
        </div>

        <!-- Main Stage Video (Zoom Active Speaker Style - Full Screen Fit) -->
        <div id="main-stage" class="flex-1 w-full h-full relative flex items-center justify-center bg-slate-950 overflow-hidden">
            <!-- Default placeholder when alone -->
            <div id="stage-placeholder" class="text-center p-6 text-slate-500">
                <div class="text-4xl mb-2"></div>
                <p class="text-xs">Waiting for others to join...</p>
                <button onclick="copyInviteLink()" class="mt-3 bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 border border-indigo-500/30 text-xs px-3 py-1.5 rounded-lg transition">Copy Invite Link</button>
            </div>
        </div>

        <!-- Floating Thumbnail Strip for Local & Other Participants (Zoom Style Bottom Strip) -->
        <div id="thumbnail-strip" class="absolute bottom-20 left-4 right-4 flex gap-2 overflow-x-auto z-30 justify-center pb-2 pointer-events-auto">
            <!-- Local Video Thumbnail -->
            <div id="local-thumb-box" class="relative w-28 h-20 sm:w-36 sm:h-24 bg-slate-900 rounded-xl overflow-hidden border border-slate-700 shadow-xl flex-shrink-0 flex items-center justify-center">
                <video id="local-video" autoplay muted playsinline class="w-full h-full object-contain transform -scale-x-100 bg-black"></video>
                <span id="local-label" class="absolute bottom-1 left-1 bg-black/60 backdrop-blur-sm text-white text-[10px] px-1.5 py-0.5 rounded font-medium">You</span>
                <span id="local-hand" class="absolute top-1 right-1 text-sm hidden">✋</span>
            </div>
        </div>

        <!-- Floating Emoji Reaction Tray -->
        <div id="reaction-container" class="absolute bottom-20 right-4 flex flex-col gap-2 z-40"></div>

        <!-- Floating Chat Overlay Drawer (Zoom Style Side/Bottom Sheet) -->
        <div id="chat-drawer" class="hidden absolute right-0 top-0 bottom-0 w-80 max-w-full bg-slate-900/95 backdrop-blur-xl border-l border-slate-800 flex flex-col shadow-2xl z-50 transition-transform duration-300">
            <div class="p-3.5 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
                <h3 class="font-bold text-xs text-slate-200">Meeting Chat</h3>
                <button onclick="toggleChatDrawer()" class="text-slate-400 hover:text-white text-xs">✕</button>
            </div>
            <div id="chat-messages" class="flex-1 p-3 overflow-y-auto space-y-2 text-xs"></div>
            <div class="p-3 border-t border-slate-800 flex gap-2 bg-slate-900/50">
                <input type="text" id="chat-input" placeholder="Type message..." onkeypress="handleChatKey(event)" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500 text-slate-100">
                <button onclick="sendChatMessage()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-xl text-xs font-medium">Send</button>
            </div>
        </div>

        <!-- Bottom Control Bar (Zoom Style Floating Dock) -->
        <div class="absolute bottom-3 left-1/2 transform -translate-x-1/2 z-40 bg-slate-900/90 backdrop-blur-md border border-slate-800 px-4 py-2.5 rounded-2xl shadow-2xl flex items-center gap-2 sm:gap-3 flex-wrap justify-center">
            <button onclick="toggleAudio()" id="audio-btn" class="flex flex-col items-center gap-0.5 text-slate-300 hover:text-white text-[10px] transition">
                <span class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-sm">🎤</span>
                <span id="audio-txt">Mute</span>
            </button>
            <button onclick="toggleVideo()" id="video-btn" class="flex flex-col items-center gap-0.5 text-slate-300 hover:text-white text-[10px] transition">
                <span class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-sm">📹</span>
                <span id="video-txt">Stop Cam</span>
            </button>
            <button onclick="flipCamera()" class="hidden sm:flex flex-col items-center gap-0.5 text-slate-300 hover:text-white text-[10px] transition">
                <span class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-sm">🔄</span>
                <span>Flip</span>
            </button>
            <button onclick="toggleVirtualBlur()" id="blur-btn" class="flex flex-col items-center gap-0.5 text-slate-300 hover:text-white text-[10px] transition">
                <span class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-sm">✨</span>
                <span>Blur</span>
            </button>
            <button onclick="toggleScreenShare()" id="screen-btn" class="flex flex-col items-center gap-0.5 text-slate-300 hover:text-white text-[10px] transition">
                <span class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-sm">💻</span>
                <span>Share</span>
            </button>
            <button onclick="toggleRecording()" id="rec-btn" class="flex flex-col items-center gap-0.5 text-slate-300 hover:text-white text-[10px] transition">
                <span class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-sm">🔴</span>
                <span>Record</span>
            </button>
            <button onclick="toggleHandRaise()" id="hand-btn" class="flex flex-col items-center gap-0.5 text-slate-300 hover:text-white text-[10px] transition">
                <span class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-sm">✋</span>
                <span>Hand</span>
            </button>
            <button onclick="toggleChatDrawer()" class="flex flex-col items-center gap-0.5 text-slate-300 hover:text-white text-[10px] transition">
                <span class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-sm">💬</span>
                <span>Chat</span>
            </button>
            <button onclick="copyInviteLink()" class="flex flex-col items-center gap-0.5 text-slate-300 hover:text-white text-[10px] transition">
                <span class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-sm">📋</span>
                <span>Invite</span>
            </button>
            <div class="h-6 w-px bg-slate-800 mx-1"></div>
            <button onclick="leaveRoom()" class="bg-red-600 hover:bg-red-500 text-white font-medium px-4 py-2 rounded-xl text-xs transition shadow-lg shadow-red-600/20">
                Leave
            </button>
        </div>

    </div>

    <!-- ================= APPLICATION LOGIC ================= -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCogqoa3XULwSYW46AGNkpWWuu2K4JZdoI",
            authDomain: "vaultchatapp-65e05.firebaseapp.com",
            databaseURL: "https://vaultchatapp-65e05-default-rtdb.firebaseio.com",
            projectId: "vaultchatapp-65e05",
            storageBucket: "vaultchatapp-65e05.firebasestorage.app",
            messagingSenderId: "598529835602",
            appId: "1:598529835602:web:d6e58dd829b4294a64958b"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let localStream = null;
        let peer = null;
        let roomCode = "";
        let userName = "";
        let activePeers = {};
        let useFrontCamera = true;
        let callTimerInterval = null;
        let secondsElapsed = 0;
        let isHandRaised = false;
        let isDarkMode = true;
        let isBlurred = false;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let isHost = false;
        let isSharingScreen = false;
        let activeSpeakerId = null; // Zoom style main stage target

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('-translate-y-20');
            setTimeout(() => {
                toast.classList.add('-translate-y-20');
            }, 3000);
        }

        async function initMedia(facingMode = 'user') {
            try {
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                }
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } }, 
                    audio: true 
                });
                document.getElementById('local-video').srcObject = localStream;
            } catch (err) {
                console.error("Media access error:", err);
            }
        }
        initMedia();

        async function joinRoom() {
            userName = document.getElementById('user-name-input').value.trim();
            roomCode = document.getElementById('room-code-input').value.trim().toLowerCase();

            if (!userName || !roomCode) {
                alert("Please enter both your name and a room code!");
                return;
            }

            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('call-screen').classList.remove('hidden');
            document.getElementById('display-room-title').innerText = `Room: ${roomCode.toUpperCase()}`;
            document.getElementById('local-label').innerText = `${userName} (You)`;

            startCallTimer();

            db.ref('rooms/' + roomCode).once('value', (snapshot) => {
                if (!snapshot.exists()) isHost = true;
            });

            peer = new Peer();

            peer.on('open', (id) => {
                const roomRef = db.ref('rooms/' + roomCode + '/' + id);
                roomRef.set({ name: userName, handRaised: false, muted: false });
                roomRef.onDisconnect().remove();

                listenForPeers();
                listenForChat();
                listenForReactions();
                listenForParticipantCount();
                listenForHostActions(id);
            });

            peer.on('call', (call) => {
                if (!localStream) {
                    navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
                        localStream = stream;
                        call.answer(localStream);
                        handleIncomingCall(call);
                    }).catch(e => console.error(e));
                } else {
                    call.answer(localStream);
                    handleIncomingCall(call);
                }
            });
        }

        function startCallTimer() {
            secondsElapsed = 0;
            callTimerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const secs = String(secondsElapsed % 60).padStart(2, '0');
                document.getElementById('call-timer').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        async function flipCamera() {
            if (!localStream) return;
            useFrontCamera = !useFrontCamera;
            await initMedia(useFrontCamera ? 'user' : 'environment');
            updateStreamTracks();
        }

        function updateStreamTracks() {
            if (localStream && localStream.getVideoTracks().length > 0) {
                const videoTrack = localStream.getVideoTracks()[0];
                for (let peerId in activePeers) {
                    const sender = activePeers[peerId].peerConnection?.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (sender) sender.replaceTrack(videoTrack);
                }
            }
        }

        function toggleVirtualBlur() {
            isBlurred = !isBlurred;
            const videoElem = document.getElementById('local-video');
            if (isBlurred) {
                videoElem.classList.add('blur-bg');
                showToast("Background blurred");
            } else {
                videoElem.classList.remove('blur-bg');
                showToast("Background unblurred");
            }
        }

        async function toggleScreenShare() {
            try {
                if (!isSharingScreen) {
                    if (!navigator.mediaDevices.getDisplayMedia) {
                        alert("Screen sharing not supported on this browser.");
                        return;
                    }
                    const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                    const videoTrack = screenStream.getVideoTracks()[0];

                    for (let peerId in activePeers) {
                        const sender = activePeers[peerId].peerConnection?.getSenders().find(s => s.track && s.track.kind === 'video');
                        if (sender) sender.replaceTrack(videoTrack);
                    }

                    document.getElementById('local-video').srcObject = screenStream;
                    isSharingScreen = true;
                    showToast("Screen sharing started");

                    videoTrack.onended = () => { stopScreenShare(); };
                } else {
                    stopScreenShare();
                }
            } catch (err) {
                console.error("Screen share error:", err);
            }
        }

        function stopScreenShare() {
            if (localStream && localStream.getVideoTracks().length > 0) {
                const videoTrack = localStream.getVideoTracks()[0];
                for (let peerId in activePeers) {
                    const sender = activePeers[peerId].peerConnection?.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (sender) sender.replaceTrack(videoTrack);
                }
                document.getElementById('local-video').srcObject = localStream;
            }
            isSharingScreen = false;
            showToast("Screen sharing stopped");
        }

        function toggleRecording() {
            const recBadge = document.getElementById('recording-badge');
            if (!isRecording) {
                recordedChunks = [];
                try {
                    mediaRecorder = new MediaRecorder(localStream, { mimeType: 'video/webm; codecs=vp9' });
                } catch (e) {
                    try { mediaRecorder = new MediaRecorder(localStream); } catch (err) {
                        alert("Recording not supported.");
                        return;
                    }
                }
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `meeting-${Date.now()}.webm`;
                    a.click();
                    showToast("Recording saved!");
                };
                mediaRecorder.start();
                isRecording = true;
                recBadge.classList.remove('hidden');
                showToast("Recording started...");
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recBadge.classList.add('hidden');
            }
        }

        function toggleHandRaise() {
            isHandRaised = !isHandRaised;
            document.getElementById('local-hand').classList.toggle('hidden', !isHandRaised);
            showToast(isHandRaised ? "Hand raised" : "Hand lowered");
            if (peer && roomCode) db.ref('rooms/' + roomCode + '/' + peer.id).update({ handRaised: isHandRaised });
        }

        function listenForParticipantCount() {
            db.ref('rooms/' + roomCode).on('value', (snapshot) => {
                snapshot.forEach((childSnap) => {
                    const pId = childSnap.key;
                    const pData = childSnap.val();
                    if (peer && pId !== peer.id) {
                        const handElem = document.getElementById(`remote-hand-${pId}`);
                        if (handElem) handElem.classList.toggle('hidden', !pData.handRaised);
                    }
                });
            });
        }

        function listenForHostActions(myId) {
            db.ref('rooms/' + roomCode + '/' + myId).on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    if (data.forceMute && !isMuted) toggleAudio();
                    if (data.kicked) { alert("Removed by host."); leaveRoom(); }
                }
            });
        }

        function sendReaction(emoji) {
            db.ref('reactions/' + roomCode).push({ emoji: emoji, sender: userName, timestamp: Date.now() });
        }

        function listenForReactions() {
            db.ref('reactions/' + roomCode).on('child_added', (snapshot) => {
                const data = snapshot.val();
                showFloatingEmoji(data.emoji);
            });
        }

        function showFloatingEmoji(emoji) {
            const container = document.getElementById('call-screen');
            const span = document.createElement('span');
            span.className = 'floating-emoji';
            span.innerText = emoji;
            span.style.left = `${Math.random() * 70 + 15}%`;
            container.appendChild(span);
            setTimeout(() => span.remove(), 2000);
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            const body = document.getElementById('app-body');
            if (isDarkMode) {
                body.className = "bg-slate-950 text-slate-100 h-screen w-screen overflow-hidden flex flex-col justify-between selection:bg-indigo-500 selection:text-white";
                document.getElementById('theme-btn').innerText = "🌙";
            } else {
                body.className = "bg-slate-100 text-slate-900 h-screen w-screen overflow-hidden flex flex-col justify-between selection:bg-indigo-500 selection:text-white";
                document.getElementById('theme-btn').innerText = "☀️";
            }
        }

        function listenForPeers() {
            db.ref('rooms/' + roomCode).on('child_added', (snapshot) => {
                const remotePeerId = snapshot.key;
                const peerData = snapshot.val();
                if (remotePeerId !== peer.id && !activePeers[remotePeerId]) {
                    setTimeout(() => {
                        if (localStream) {
                            const call = peer.call(remotePeerId, localStream);
                            handleIncomingCall(call, peerData.name);
                        }
                    }, 500);
                }
            });

            db.ref('rooms/' + roomCode).on('child_removed', (snapshot) => {
                removeRemoteParticipant(snapshot.key);
            });
        }

        function handleIncomingCall(call, peerName = "Participant") {
            activePeers[call.peer] = call;
            call.on('stream', (remoteStream) => {
                addRemoteParticipant(call.peer, remoteStream, peerName);
            });
            call.on('close', () => {
                removeRemoteParticipant(call.peer);
            });
        }

        // Zoom Style Active Speaker Stage Switcher
        function setMainStageStream(stream, name, pId) {
            const stage = document.getElementById('main-stage');
            stage.innerHTML = `
                <video autoplay playsinline class="w-full h-full object-contain bg-black"></video>
                <div class="absolute bottom-4 left-4 bg-black/60 backdrop-blur-md text-white text-xs px-3 py-1.5 rounded-lg font-medium">${escapeHtml(name)}</div>
                <span id="stage-hand" class="absolute top-4 right-4 text-2xl hidden">✋</span>
            `;
            const videoElem = stage.querySelector('video');
            videoElem.srcObject = stream;
            videoElem.play().catch(e => console.log(e));
            activeSpeakerId = pId;
            document.getElementById('stage-placeholder')?.remove();
        }

        function addRemoteParticipant(peerId, stream, name) {
            // If main stage is empty, set this remote user as main stage
            if (!activeSpeakerId) {
                setMainStageStream(stream, name, peerId);
            }

            // Add to thumbnail strip
            const strip = document.getElementById('thumbnail-strip');
            let thumb = document.getElementById(`thumb-${peerId}`);
            if (!thumb) {
                thumb = document.createElement('div');
                thumb.id = `thumb-${peerId}`;
                thumb.className = "relative w-28 h-20 sm:w-36 sm:h-24 bg-slate-900 rounded-xl overflow-hidden border border-slate-700 shadow-xl flex-shrink-0 cursor-pointer flex items-center justify-center hover:border-indigo-500 transition";
                thumb.onclick = () => setMainStageStream(stream, name, peerId);
                thumb.innerHTML = `
                    <video autoplay playsinline class="w-full h-full object-cover bg-black"></video>
                    <span class="absolute bottom-1 left-1 bg-black/60 backdrop-blur-sm text-white text-[10px] px-1.5 py-0.5 rounded font-medium">${escapeHtml(name)}</span>
                    <span id="remote-hand-${peerId}" class="absolute top-1 right-1 text-sm hidden">✋</span>
                `;
                strip.appendChild(thumb);
            }
            const vElem = thumb.querySelector('video');
            if (vElem.srcObject !== stream) {
                vElem.srcObject = stream;
                vElem.play().catch(e => console.log(e));
            }
        }

        function removeRemoteParticipant(peerId) {
            const thumb = document.getElementById(`thumb-${peerId}`);
            if (thumb) thumb.remove();
            delete activePeers[peerId];
            if (activeSpeakerId === peerId) {
                activeSpeakerId = null;
                // Fallback main stage to local video or placeholder
                const keys = Object.keys(activePeers);
                if (keys.length > 0) {
                    // switch to another peer if available
                } else {
                    document.getElementById('main-stage').innerHTML = `
                        <div id="stage-placeholder" class="text-center p-6 text-slate-500">
                            <div class="text-4xl mb-2">📹</div>
                            <p class="text-xs">Waiting for others to join...</p>
                        </div>
                    `;
                }
            }
        }

        function copyInviteLink() {
            const inviteUrl = window.location.href.split('?')[0] + `?room=${roomCode}`;
            navigator.clipboard.writeText(inviteUrl);
            showToast("Invite link copied!");
        }

        function toggleChatDrawer() {
            document.getElementById('chat-drawer').classList.toggle('hidden');
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            db.ref('chats/' + roomCode).push({ sender: userName, text: text, timestamp: Date.now() });
            input.value = "";
        }

        function handleChatKey(e) { if (e.key === 'Enter') sendChatMessage(); }

        function listenForChat() {
            db.ref('chats/' + roomCode).on('child_added', (snapshot) => {
                appendChatMessage(snapshot.val());
            });
        }

        function appendChatMessage(msg) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = "flex flex-col bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/80";
            div.innerHTML = `
                <div class="flex justify-between text-[10px] text-indigo-400 font-semibold mb-0.5">
                    <span>${escapeHtml(msg.sender)}</span>
                    <span class="text-slate-500">${new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                </div>
                <p class="text-slate-200 break-words">${escapeHtml(msg.text)}</p>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        let isMuted = false;
        function toggleAudio() {
            if (!localStream) return;
            isMuted = !isMuted;
            localStream.getAudioTracks()[0].enabled = !isMuted;
            document.getElementById('audio-txt').innerText = isMuted ? "Unmute" : "Mute";
            showToast(isMuted ? "Microphone muted" : "Microphone unmuted");
        }

        let isVideoOff = false;
        function toggleVideo() {
            if (!localStream) return;
            isVideoOff = !isVideoOff;
            localStream.getVideoTracks()[0].enabled = !isVideoOff;
            document.getElementById('video-txt').innerText = isVideoOff ? "Start Cam" : "Stop Cam";
            showToast(isVideoOff ? "Camera stopped" : "Camera started");
        }

        function leaveRoom() {
            if (peer) {
                db.ref('rooms/' + roomCode + '/' + peer.id).remove();
                peer.destroy();
            }
            if (callTimerInterval) clearInterval(callTimerInterval);
            window.location.reload();
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
