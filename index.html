<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectMe - Live Video Rooms</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase App & Database -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <!-- PeerJS for WebRTC Video/Audio -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        @keyframes floatUp {
            0% { transform: translateY(0px) scale(0.8); opacity: 1; }
            100% { transform: translateY(-180px) scale(1.4); opacity: 0; }
        }
        .floating-emoji {
            animation: floatUp 2s ease-out forwards;
            pointer-events: none;
            position: absolute;
            bottom: 20px;
            z-index: 50;
            font-size: 2rem;
        }
    </style>
</head>
<body id="app-body" class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden transition-colors duration-300">

    <!-- ================= 1. HOME / JOIN SCREEN ================= -->
    <div id="home-screen" class="flex-1 flex items-center justify-center p-4">
        <div id="home-card" class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-8 shadow-2xl transition-colors duration-300">
            <div class="text-center mb-6">
                <div class="text-4xl mb-2">📹</div>
                <h1 class="text-2xl font-bold tracking-tight">ConnectMe</h1>
                <p class="text-xs text-slate-400 mt-1">HD Video Rooms for Family & Friends</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Your Name</label>
                    <input type="text" id="user-name-input" placeholder="e.g. Rahul" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-100">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Room Code / ID</label>
                    <input type="text" id="room-code-input" placeholder="e.g. family-8pm" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-100 uppercase tracking-wider font-mono">
                </div>
                <button onclick="joinRoom()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg py-2.5 text-sm transition shadow-lg shadow-indigo-600/30">
                    Join Room
                </button>
            </div>
        </div>
    </div>

    <!-- ================= 2. VIDEO CALL SCREEN ================= -->
    <div id="call-screen" class="hidden flex-1 flex flex-col h-screen p-4 max-w-7xl mx-auto w-full">
        <!-- Top Bar -->
        <div id="top-bar" class="flex flex-wrap justify-between items-center bg-slate-800 px-4 py-3 rounded-xl mb-4 border border-slate-700 shadow-md gap-3 transition-colors duration-300">
            <div class="flex items-center gap-3">
                <div>
                    <h2 id="display-room-title" class="font-bold text-sm text-indigo-400">Room: --</h2>
                    <p id="call-timer" class="text-xs text-slate-400 font-mono">⏱️ 00:00</p>
                </div>
                <span id="participant-badge" class="bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 text-xs px-2.5 py-1 rounded-full font-medium">👥 1 Online</span>
            </div>
            
            <div class="flex items-center flex-wrap gap-2">
                <button onclick="copyInviteLink()" class="bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 border border-indigo-500/30 px-3 py-2 rounded-lg text-xs font-medium transition">📋 Copy Invite</button>
                <button onclick="toggleAudio()" id="audio-btn" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-xs font-medium transition">🎤 Mute</button>
                <button onclick="toggleVideo()" id="video-btn" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-xs font-medium transition">📷 Stop Cam</button>
                <button onclick="flipCamera()" id="flip-btn" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-xs font-medium transition">🔄 Flip Cam</button>
                <button onclick="toggleHandRaise()" id="hand-btn" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-xs font-medium transition">✋ Raise Hand</button>
                <button onclick="toggleScreenShare()" id="screen-btn" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-xs font-medium transition">💻 Share</button>
                <button onclick="toggleChatDrawer()" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-xs font-medium transition">💬 Chat</button>
                <button onclick="toggleTheme()" id="theme-btn" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-xs font-medium transition">🌙 Theme</button>
                <button onclick="leaveRoom()" class="bg-red-600 hover:bg-red-500 text-white px-3 py-2 rounded-lg text-xs font-medium transition">Leave</button>
            </div>
        </div>

        <!-- Main Content Area (Videos Grid + Chat Drawer) -->
        <div class="flex-1 flex gap-4 overflow-hidden relative">
            <!-- Video Dynamic Grid -->
            <div id="video-grid" class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4 items-center justify-center overflow-y-auto content-center relative">
                <!-- Local Video Card -->
                <div class="relative bg-slate-800 rounded-2xl overflow-hidden border border-slate-700 aspect-video flex items-center justify-center shadow-inner">
                    <video id="local-video" autoplay muted playsinline class="w-full h-full object-cover transform -scale-x-100"></video>
                    <span id="local-label" class="absolute bottom-3 left-3 bg-black/60 backdrop-blur-md text-white text-xs px-2.5 py-1 rounded-md font-medium">You</span>
                    <span id="local-hand" class="absolute top-3 right-3 text-xl hidden">✋</span>
                </div>
            </div>

            <!-- Floating Emoji Tray & Reactions Container -->
            <div id="reaction-container" class="absolute bottom-6 left-6 flex gap-2 bg-slate-800/80 backdrop-blur-md p-2 rounded-xl border border-slate-700 shadow-lg z-40">
                <button onclick="sendReaction('❤️')" class="hover:scale-125 transition text-lg">❤️</button>
                <button onclick="sendReaction('😂')" class="hover:scale-125 transition text-lg">😂</button>
                <button onclick="sendReaction('👍')" class="hover:scale-125 transition text-lg">👍</button>
                <button onclick="sendReaction('👏')" class="hover:scale-125 transition text-lg">👏</button>
                <button onclick="sendReaction('🔥')" class="hover:scale-125 transition text-lg">🔥</button>
            </div>

            <!-- In-Call Chat Drawer -->
            <div id="chat-drawer" class="hidden w-80 bg-slate-800 border border-slate-700 rounded-2xl flex flex-col overflow-hidden shadow-xl transition-colors duration-300">
                <div class="bg-slate-700/50 p-3 border-b border-slate-700 flex justify-between items-center">
                    <h3 class="font-bold text-xs text-slate-200">Room Chat</h3>
                    <button onclick="toggleChatDrawer()" class="text-slate-400 hover:text-white text-xs">✕</button>
                </div>
                <div id="chat-messages" class="flex-1 p-3 overflow-y-auto space-y-2 text-xs">
                    <!-- Dynamic Messages -->
                </div>
                <div class="p-2.5 border-t border-slate-700 flex gap-2">
                    <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="handleChatKey(event)" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500 text-slate-100">
                    <button onclick="sendChatMessage()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-lg text-xs font-medium">Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-3 text-xs text-slate-500 border-t border-slate-800 transition-colors duration-300">
        ConnectMe Video Platform &copy; 2026
    </footer>

    <!-- ================= APPLICATION LOGIC ================= -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCogqoa3XULwSYW46AGNkpWWuu2K4JZdoI",
            authDomain: "vaultchatapp-65e05.firebaseapp.com",
            databaseURL: "https://vaultchatapp-65e05-default-rtdb.firebaseio.com",
            projectId: "vaultchatapp-65e05",
            storageBucket: "vaultchatapp-65e05.firebasestorage.app",
            messagingSenderId: "598529835602",
            appId: "1:598529835602:web:d6e58dd829b4294a64958b"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let localStream = null;
        let peer = null;
        let roomCode = "";
        let userName = "";
        let activePeers = {};
        let useFrontCamera = true;
        let callTimerInterval = null;
        let secondsElapsed = 0;
        let isHandRaised = false;
        let isDarkMode = true;

        async function initMedia(facingMode = 'user') {
            try {
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                }
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: facingMode }, 
                    audio: true 
                });
                document.getElementById('local-video').srcObject = localStream;
            } catch (err) {
                console.error("Media access error:", err);
            }
        }
        initMedia();

        async function joinRoom() {
            userName = document.getElementById('user-name-input').value.trim();
            roomCode = document.getElementById('room-code-input').value.trim().toLowerCase();

            if (!userName || !roomCode) {
                alert("Please enter both your name and a room code!");
                return;
            }

            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('call-screen').classList.remove('hidden');
            document.getElementById('display-room-title').innerText = `Room: ${roomCode.toUpperCase()}`;
            document.getElementById('local-label').innerText = `${userName} (You)`;

            startCallTimer();

            peer = new Peer();

            peer.on('open', (id) => {
                const roomRef = db.ref('rooms/' + roomCode + '/' + id);
                roomRef.set({ name: userName, handRaised: false });
                roomRef.onDisconnect().remove();

                listenForPeers();
                listenForChat();
                listenForReactions();
                listenForParticipantCount();
            });

            peer.on('call', (call) => {
                if (!localStream) {
                    navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
                        localStream = stream;
                        call.answer(localStream);
                        handleIncomingCall(call);
                    }).catch(e => console.error(e));
                } else {
                    call.answer(localStream);
                    handleIncomingCall(call);
                }
            });
        }

        function startCallTimer() {
            secondsElapsed = 0;
            callTimerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const secs = String(secondsElapsed % 60).padStart(2, '0');
                document.getElementById('call-timer').innerText = `⏱️ ${mins}:${secs}`;
            }, 1000);
        }

        async function flipCamera() {
            if (!localStream) {
                alert("Camera stream not available!");
                return;
            }
            useFrontCamera = !useFrontCamera;
            const mode = useFrontCamera ? 'user' : 'environment';
            await initMedia(mode);
            
            if (localStream && localStream.getVideoTracks().length > 0) {
                const videoTrack = localStream.getVideoTracks()[0];
                for (let peerId in activePeers) {
                    const sender = activePeers[peerId].peerConnection?.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (sender) sender.replaceTrack(videoTrack);
                }
            }
        }

        function toggleHandRaise() {
            isHandRaised = !isHandRaised;
            const btn = document.getElementById('hand-btn');
            const handBadge = document.getElementById('local-hand');

            if (isHandRaised) {
                btn.className = "bg-yellow-600 text-white px-3 py-2 rounded-lg text-xs font-medium transition";
                btn.innerText = "✋ Lower Hand";
                handBadge.classList.remove('hidden');
            } else {
                btn.className = "bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-xs font-medium transition";
                btn.innerText = "✋ Raise Hand";
                handBadge.classList.add('hidden');
            }

            if (peer && roomCode) {
                db.ref('rooms/' + roomCode + '/' + peer.id).update({ handRaised: isHandRaised });
            }
        }

        function listenForParticipantCount() {
            db.ref('rooms/' + roomCode).on('value', (snapshot) => {
                const count = snapshot.numChildren();
                document.getElementById('participant-badge').innerText = `👥 ${count} Online`;

                snapshot.forEach((childSnap) => {
                    const pId = childSnap.key;
                    const pData = childSnap.val();
                    if (peer && pId !== peer.id) {
                        const remoteHand = document.getElementById(`remote-hand-${pId}`);
                        if (remoteHand) {
                            if (pData.handRaised) remoteHand.classList.remove('hidden');
                            else remoteHand.classList.add('hidden');
                        }
                    }
                });
            });
        }

        function sendReaction(emoji) {
            db.ref('reactions/' + roomCode).push({
                emoji: emoji,
                sender: userName,
                timestamp: Date.now()
            });
        }

        function listenForReactions() {
            db.ref('reactions/' + roomCode).on('child_added', (snapshot) => {
                const data = snapshot.val();
                showFloatingEmoji(data.emoji);
            });
        }

        function showFloatingEmoji(emoji) {
            const container = document.getElementById('video-grid');
            const span = document.createElement('span');
            span.className = 'floating-emoji';
            span.innerText = emoji;
            span.style.left = `${Math.random() * 80 + 10}%`;
            container.appendChild(span);
            setTimeout(() => span.remove(), 2000);
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            const body = document.getElementById('app-body');
            const homeCard = document.getElementById('home-card');
            const topBar = document.getElementById('top-bar');
            const chatDrawer = document.getElementById('chat-drawer');
            const themeBtn = document.getElementById('theme-btn');

            if (isDarkMode) {
                body.className = "bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden transition-colors duration-300";
                homeCard.className = "bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-8 shadow-2xl transition-colors duration-300";
                topBar.className = "flex flex-wrap justify-between items-center bg-slate-800 px-4 py-3 rounded-xl mb-4 border border-slate-700 shadow-md gap-3 transition-colors duration-300";
                chatDrawer.className = "hidden w-80 bg-slate-800 border border-slate-700 rounded-2xl flex flex-col overflow-hidden shadow-xl transition-colors duration-300";
                themeBtn.innerText = "🌙 Theme";
            } else {
                body.className = "bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between overflow-x-hidden transition-colors duration-300";
                homeCard.className = "bg-white border border-slate-200 rounded-2xl max-w-md w-full p-8 shadow-2xl transition-colors duration-300";
                topBar.className = "flex flex-wrap justify-between items-center bg-white px-4 py-3 rounded-xl mb-4 border border-slate-200 shadow-md gap-3 transition-colors duration-300";
                chatDrawer.className = "hidden w-80 bg-white border border-slate-200 rounded-2xl flex flex-col overflow-hidden shadow-xl transition-colors duration-300";
                themeBtn.innerText = "☀️ Theme";
            }
        }

        function listenForPeers() {
            const roomRef = db.ref('rooms/' + roomCode);
            
            roomRef.on('child_added', (snapshot) => {
                const remotePeerId = snapshot.key;
                const peerData = snapshot.val();

                if (remotePeerId !== peer.id && !activePeers[remotePeerId]) {
                    setTimeout(() => {
                        if (localStream) {
                            const call = peer.call(remotePeerId, localStream);
                            handleIncomingCall(call, peerData.name);
                        }
                    }, 800);
                }
            });

            roomRef.on('child_removed', (snapshot) => {
                const remotePeerId = snapshot.key;
                removeRemoteVideo(remotePeerId);
            });
        }

        function handleIncomingCall(call, peerName = "Participant") {
            activePeers[call.peer] = call;

            call.on('stream', (remoteStream) => {
                addRemoteVideo(call.peer, remoteStream, peerName);
            });

            call.on('close', () => {
                removeRemoteVideo(call.peer);
            });
        }

        function addRemoteVideo(peerId, stream, name) {
            let div = document.getElementById(`video-box-${peerId}`);
            if (!div) {
                const grid = document.getElementById('video-grid');
                div = document.createElement('div');
                div.id = `video-box-${peerId}`;
                div.className = "relative bg-slate-800 rounded-2xl overflow-hidden border border-slate-700 aspect-video flex items-center justify-center shadow-inner";
                
                div.innerHTML = `
                    <video autoplay playsinline class="w-full h-full object-cover"></video>
                    <span class="absolute bottom-3 left-3 bg-black/60 backdrop-blur-md text-white text-xs px-2.5 py-1 rounded-md font-medium">${escapeHtml(name)}</span>
                    <span id="remote-hand-${peerId}" class="absolute top-3 right-3 text-xl hidden">✋</span>
                `;
                grid.appendChild(div);
            }
            const videoElem = div.querySelector('video');
            if (videoElem.srcObject !== stream) {
                videoElem.srcObject = stream;
                videoElem.play().catch(e => console.log("Autoplay prevented:", e));
            }
        }

        function removeRemoteVideo(peerId) {
            const box = document.getElementById(`video-box-${peerId}`);
            if (box) box.remove();
            delete activePeers[peerId];
        }

        function copyInviteLink() {
            const inviteUrl = window.location.href.split('?')[0] + `?room=${roomCode}`;
            navigator.clipboard.writeText(inviteUrl);
            alert("Invite link copied to clipboard!");
        }

        let isSharingScreen = false;
        async function toggleScreenShare() {
            try {
                if (!isSharingScreen) {
                    const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                    const videoTrack = screenStream.getVideoTracks()[0];

                    for (let peerId in activePeers) {
                        const sender = activePeers[peerId].peerConnection?.getSenders().find(s => s.track && s.track.kind === 'video');
                        if (sender) sender.replaceTrack(videoTrack);
                    }

                    document.getElementById('local-video').srcObject = screenStream;
                    isSharingScreen = true;
                    document.getElementById('screen-btn').innerText = "💻 Stop";
                    document.getElementById('screen-btn').className = "bg-indigo-600 text-white px-3 py-2 rounded-lg text-xs font-medium transition";

                    videoTrack.onended = () => { stopScreenShare(); };
                } else {
                    stopScreenShare();
                }
            } catch (err) {
                console.error("Screen share error:", err);
            }
        }

        function stopScreenShare() {
            if (localStream && localStream.getVideoTracks().length > 0) {
                const videoTrack = localStream.getVideoTracks()[0];
                for (let peerId in activePeers) {
                    const sender = activePeers[peerId].peerConnection?.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (sender) sender.replaceTrack(videoTrack);
                }
                document.getElementById('local-video').srcObject = localStream;
            }
            isSharingScreen = false;
            document.getElementById('screen-btn').innerText = "💻 Share";
            document.getElementById('screen-btn').className = "bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-xs font-medium transition";
        }

        function toggleChatDrawer() {
            document.getElementById('chat-drawer').classList.toggle('hidden');
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            db.ref('chats/' + roomCode).push({
                sender: userName,
                text: text,
                timestamp: Date.now()
            });
            input.value = "";
        }

        function handleChatKey(e) {
            if (e.key === 'Enter') sendChatMessage();
        }

        function listenForChat() {
            db.ref('chats/' + roomCode).on('child_added', (snapshot) => {
                appendChatMessage(snapshot.val());
            });
        }

        function appendChatMessage(msg) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = "flex flex-col bg-slate-900/50 p-2 rounded-lg border border-slate-700/50";
            div.innerHTML = `
                <div class="flex justify-between text-[10px] text-indigo-400 font-semibold mb-0.5">
                    <span>${escapeHtml(msg.sender)}</span>
                    <span class="text-slate-500">${new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                </div>
                <p class="text-slate-200 break-words">${escapeHtml(msg.text)}</p>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        let isMuted = false;
        function toggleAudio() {
            if (!localStream) return;
            isMuted = !isMuted;
            localStream.getAudioTracks()[0].enabled = !isMuted;
            document.getElementById('audio-btn').innerText = isMuted ? "🎤 Unmute" : "🎤 Mute";
            document.getElementById('audio-btn').className = isMuted ? "bg-red-600 text-white px-3 py-2 rounded-lg text-xs font-medium transition" : "bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-xs font-medium transition";
        }

        let isVideoOff = false;
        function toggleVideo() {
            if (!localStream) return;
            isVideoOff = !isVideoOff;
            localStream.getVideoTracks()[0].enabled = !isVideoOff;
            document.getElementById('video-btn').innerText = isVideoOff ? "📷 Start Cam" : "📷 Stop Cam";
            document.getElementById('video-btn').className = isVideoOff ? "bg-red-600 text-white px-3 py-2 rounded-lg text-xs font-medium transition" : "bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-xs font-medium transition";
        }

        function leaveRoom() {
            if (peer) {
                db.ref('rooms/' + roomCode + '/' + peer.id).remove();
                peer.destroy();
            }
            if (callTimerInterval) clearInterval(callTimerInterval);
            window.location.reload();
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
