<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectMe Enterprise - Ultimate</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase App & Database -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <!-- PeerJS for WebRTC Video/Audio -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        @keyframes floatUp {
            0% { transform: translateY(0px) scale(0.8); opacity: 1; }
            100% { transform: translateY(-180px) scale(1.4); opacity: 0; }
        }
        .floating-emoji {
            animation: floatUp 2s ease-out forwards;
            pointer-events: none;
            position: absolute;
            bottom: 20px;
            z-index: 50;
            font-size: 2rem;
        }
        .blur-bg {
            filter: blur(12px);
            transform: scale(1.1);
        }
    </style>
</head>
<body id="app-body" class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden transition-colors duration-300">

    <!-- Toast Notification Container -->
    <div id="toast" class="fixed top-5 right-5 z-50 transform translate-x-full transition-transform duration-300 bg-indigo-600 text-white text-xs px-4 py-2.5 rounded-xl shadow-xl flex items-center gap-2">
        <span id="toast-msg">Link copied!</span>
    </div>

    <!-- ================= 1. HOME / JOIN SCREEN ================= -->
    <div id="home-screen" class="flex-1 flex items-center justify-center p-4">
        <div id="home-card" class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-8 shadow-2xl transition-colors duration-300">
            <div class="text-center mb-6">
                <div class="text-4xl mb-2">🚀</div>
                <h1 class="text-2xl font-bold tracking-tight">ConnectMe Enterprise</h1>
                <p class="text-xs text-slate-400 mt-1">Virtual BG, Password Rooms, Polls & Noise Filter</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Your Name</label>
                    <input type="text" id="user-name-input" placeholder="e.g. Mayuresh" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-100">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Room Code / ID</label>
                    <input type="text" id="room-code-input" placeholder="e.g. board-meeting" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-100 uppercase tracking-wider font-mono">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Room Password (Optional)</label>
                    <input type="password" id="room-pass-input" placeholder="4-digit PIN or password" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-100">
                </div>
                <button onclick="joinRoom()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg py-2.5 text-sm transition shadow-lg shadow-indigo-600/30">
                    Secure Join Room
                </button>
            </div>
        </div>
    </div>

    <!-- ================= PASSWORD PROMPT MODAL ================= -->
    <div id="pass-modal" class="hidden fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl">
            <h3 class="font-bold text-base mb-2">Room is Password Protected</h3>
            <p class="text-xs text-slate-400 mb-4">Enter room PIN/password to join.</p>
            <input type="password" id="modal-pass-input" placeholder="Enter password" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm mb-4 text-center text-slate-100">
            <div class="flex gap-2">
                <button onclick="verifyAndJoin()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-lg text-xs font-medium">Verify & Join</button>
                <button onclick="cancelPassword()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-300 py-2 rounded-lg text-xs font-medium">Cancel</button>
            </div>
        </div>
    </div>

    <!-- ================= POLL CREATION MODAL ================= -->
    <div id="poll-modal" class="hidden fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl">
            <h3 class="font-bold text-sm mb-3">Create Live Poll</h3>
            <div class="space-y-3 mb-4">
                <input type="text" id="poll-question" placeholder="Ask a question..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100">
                <input type="text" id="poll-opt1" placeholder="Option A" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100">
                <input type="text" id="poll-opt2" placeholder="Option B" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100">
            </div>
            <div class="flex gap-2">
                <button onclick="publishPoll()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-lg text-xs font-medium">Publish Poll</button>
                <button onclick="togglePollModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-300 py-2 rounded-lg text-xs font-medium">Close</button>
            </div>
        </div>
    </div>

    <!-- ================= 2. VIDEO CALL SCREEN ================= -->
    <div id="call-screen" class="hidden flex-1 flex flex-col h-screen p-4 max-w-7xl mx-auto w-full">
        <!-- Top Bar -->
        <div id="top-bar" class="flex flex-wrap justify-between items-center bg-slate-800 px-4 py-3 rounded-xl mb-4 border border-slate-700 shadow-md gap-3 transition-colors duration-300">
            <div class="flex items-center gap-3">
                <div>
                    <h2 id="display-room-title" class="font-bold text-sm text-indigo-400">Room: --</h2>
                    <p id="call-timer" class="text-xs text-slate-400 font-mono">⏱️ 00:00</p>
                </div>
                <span id="participant-badge" class="bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 text-xs px-2.5 py-1 rounded-full font-medium">👥 1 Online</span>
                <span id="recording-badge" class="hidden bg-red-600/20 text-red-400 border border-red-500/30 text-xs px-2 py-0.5 rounded-full font-medium animate-pulse">🔴 REC</span>
            </div>
            
            <div class="flex items-center flex-wrap gap-1.5">
                <button onclick="copyInviteLink()" class="bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 border border-indigo-500/30 px-2.5 py-1.5 rounded-lg text-xs font-medium transition">📋 Invite</button>
                <button onclick="toggleAudio()" id="audio-btn" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg text-xs font-medium transition">🎤 Mute</button>
                <button onclick="toggleVideo()" id="video-btn" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg text-xs font-medium transition">📷 Cam</button>
                <button onclick="flipCamera()" id="flip-btn" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg text-xs font-medium transition">🔄 Flip</button>
                <button onclick="toggleVirtualBlur()" id="blur-btn" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg text-xs font-medium transition">✨ Blur</button>
                <button onclick="setVirtualBg('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=800')" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg text-xs font-medium transition">🌅 BG</button>
                <button onclick="toggleNoiseSuppression()" id="noise-btn" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg text-xs font-medium transition">🔊 Noise Filter</button>
                <button onclick="toggleScreenShare()" id="screen-btn" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg text-xs font-medium transition">💻 Share</button>
                <button onclick="toggleRecording()" id="rec-btn" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg text-xs font-medium transition">🔴 Rec</button>
                <button onclick="toggleHandRaise()" id="hand-btn" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg text-xs font-medium transition">✋ Hand</button>
                <button onclick="togglePollModal()" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg text-xs font-medium transition">📊 Poll</button>
                <button onclick="toggleChatDrawer()" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg text-xs font-medium transition">💬 Chat</button>
                <button onclick="toggleTheme()" id="theme-btn" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg text-xs font-medium transition">🌙</button>
                <button onclick="leaveRoom()" class="bg-red-600 hover:bg-red-500 text-white px-2.5 py-1.5 rounded-lg text-xs font-medium transition">Leave</button>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="flex-1 flex gap-4 overflow-hidden relative">
            <!-- Video Dynamic Grid -->
            <div id="video-grid" class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4 items-center justify-center overflow-y-auto content-center relative">
                <!-- Local Video Card -->
                <div id="local-box" class="relative bg-slate-800 rounded-2xl overflow-hidden border border-slate-700 aspect-video flex items-center justify-center shadow-inner">
                    <video id="local-video" autoplay muted playsinline class="w-full h-full object-contain transform -scale-x-100 bg-black"></video>
                    <span id="local-label" class="absolute bottom-3 left-3 bg-black/60 backdrop-blur-md text-white text-xs px-2.5 py-1 rounded-md font-medium">You</span>
                    <span id="local-hand" class="absolute top-3 right-3 text-xl hidden">✋</span>
                </div>
            </div>

            <!-- Floating Emoji Tray -->
            <div id="reaction-container" class="absolute bottom-6 left-6 flex gap-2 bg-slate-800/80 backdrop-blur-md p-2 rounded-xl border border-slate-700 shadow-lg z-40">
                <button onclick="sendReaction('❤️')" class="hover:scale-125 transition text-lg">❤️</button>
                <button onclick="sendReaction('😂')" class="hover:scale-125 transition text-lg">😂</button>
                <button onclick="sendReaction('👍')" class="hover:scale-125 transition text-lg">👍</button>
                <button onclick="sendReaction('👏')" class="hover:scale-125 transition text-lg">👏</button>
                <button onclick="sendReaction('🔥')" class="hover:scale-125 transition text-lg">🔥</button>
            </div>

            <!-- In-Call Chat & Polls Drawer -->
            <div id="chat-drawer" class="hidden w-80 bg-slate-800 border border-slate-700 rounded-2xl flex flex-col overflow-hidden shadow-xl transition-colors duration-300">
                <div class="bg-slate-700/50 p-3 border-b border-slate-700 flex justify-between items-center">
                    <h3 class="font-bold text-xs text-slate-200">Room Chat & Live Polls</h3>
                    <button onclick="toggleChatDrawer()" class="text-slate-400 hover:text-white text-xs">✕</button>
                </div>
                <!-- Active Poll Display Area -->
                <div id="poll-active-box" class="hidden p-3 bg-indigo-950/50 border-b border-slate-700 text-xs">
                    <p id="poll-q-display" class="font-bold text-indigo-300 mb-2"></p>
                    <div id="poll-options-box" class="space-y-1.5"></div>
                </div>
                <div id="chat-messages" class="flex-1 p-3 overflow-y-auto space-y-2 text-xs"></div>
                <div class="p-2.5 border-t border-slate-700 flex gap-2">
                    <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="handleChatKey(event)" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500 text-slate-100">
                    <button onclick="sendChatMessage()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-lg text-xs font-medium">Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-3 text-xs text-slate-500 border-t border-slate-800 transition-colors duration-300">
        ConnectMe Enterprise Video Platform &copy; 2026
    </footer>

    <!-- ================= APPLICATION LOGIC ================= -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCogqoa3XULwSYW46AGNkpWWuu2K4JZdoI",
            authDomain: "vaultchatapp-65e05.firebaseapp.com",
            databaseURL: "https://vaultchatapp-65e05-default-rtdb.firebaseio.com",
            projectId: "vaultchatapp-65e05",
            storageBucket: "vaultchatapp-65e05.firebasestorage.app",
            messagingSenderId: "598529835602",
            appId: "1:598529835602:web:d6e58dd829b4294a64958b"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let localStream = null;
        let peer = null;
        let roomCode = "";
        let userName = "";
        let roomPassword = "";
        let activePeers = {};
        let useFrontCamera = true;
        let callTimerInterval = null;
        let secondsElapsed = 0;
        let isHandRaised = false;
        let isDarkMode = true;
        let isBlurred = false;
        let isNoiseFiltered = false;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let isHost = false;
        let isSharingScreen = false;

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('translate-x-full');
            setTimeout(() => {
                toast.classList.add('translate-x-full');
            }, 3000);
        }

        async function initMedia(facingMode = 'user') {
            try {
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                }
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: facingMode }, 
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } 
                });
                document.getElementById('local-video').srcObject = localStream;
            } catch (err) {
                console.error("Media access error:", err);
            }
        }
        initMedia();

        function joinRoom() {
            userName = document.getElementById('user-name-input').value.trim();
            roomCode = document.getElementById('room-code-input').value.trim().toLowerCase();
            roomPassword = document.getElementById('room-pass-input').value.trim();

            if (!userName || !roomCode) {
                alert("Please enter both your name and a room code!");
                return;
            }

            db.ref('roomMeta/' + roomCode).once('value', (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    if (data.password && data.password !== roomPassword) {
                        document.getElementById('pass-modal').classList.remove('hidden');
                        return;
                    }
                } else {
                    if (roomPassword) {
                        db.ref('roomMeta/' + roomCode).set({ password: roomPassword });
                    }
                }
                proceedToCall();
            });
        }

        function verifyAndJoin() {
            const enteredPass = document.getElementById('modal-pass-input').value.trim();
            db.ref('roomMeta/' + roomCode + '/password').once('value', (snapshot) => {
                if (snapshot.val() === enteredPass) {
                    document.getElementById('pass-modal').classList.add('hidden');
                    proceedToCall();
                } else {
                    alert("Incorrect Room Password!");
                }
            });
        }

        function cancelPassword() {
            document.getElementById('pass-modal').classList.add('hidden');
        }

        function proceedToCall() {
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('call-screen').classList.remove('hidden');
            document.getElementById('display-room-title').innerText = `Room: ${roomCode.toUpperCase()}`;
            document.getElementById('local-label').innerText = `${userName} (You)`;

            startCallTimer();

            db.ref('rooms/' + roomCode).once('value', (snapshot) => {
                if (!snapshot.exists()) isHost = true;
            });

            peer = new Peer();

            peer.on('open', (id) => {
                const roomRef = db.ref('rooms/' + roomCode + '/' + id);
                roomRef.set({ name: userName, handRaised: false, muted: false });
                roomRef.onDisconnect().remove();

                listenForPeers();
                listenForChat();
                listenForReactions();
                listenForParticipantCount();
                listenForHostActions(id);
                listenForPolls();
            });

            peer.on('call', (call) => {
                if (!localStream) {
                    navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
                        localStream = stream;
                        document.getElementById('local-video').srcObject = localStream;
                        call.answer(localStream);
                        handleIncomingCall(call);
                    }).catch(e => console.error(e));
                } else {
                    call.answer(localStream);
                    handleIncomingCall(call);
                }
            });
        }

        function startCallTimer() {
            secondsElapsed = 0;
            callTimerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const secs = String(secondsElapsed % 60).padStart(2, '0');
                document.getElementById('call-timer').innerText = `⏱️ ${mins}:${secs}`;
            }, 1000);
        }

        async function flipCamera() {
            if (!localStream) return;
            useFrontCamera = !useFrontCamera;
            await initMedia(useFrontCamera ? 'user' : 'environment');
            updateStreamTracks();
        }

        function updateStreamTracks() {
            if (localStream && localStream.getVideoTracks().length > 0) {
                const videoTrack = localStream.getVideoTracks()[0];
                for (let peerId in activePeers) {
                    const sender = activePeers[peerId].peerConnection?.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (sender) sender.replaceTrack(videoTrack);
                }
            }
        }

        function toggleVirtualBlur() {
            isBlurred = !isBlurred;
            const videoElem = document.getElementById('local-video');
            const box = document.getElementById('local-box');
            if (isBlurred) {
                videoElem.classList.add('blur-bg');
                box.style.backgroundImage = 'none';
                showToast("Background blurred");
            } else {
                videoElem.classList.remove('blur-bg');
                showToast("Background unblurred");
            }
        }

        function setVirtualBg(imgUrl) {
            const box = document.getElementById('local-box');
            const videoElem = document.getElementById('local-video');
            videoElem.classList.remove('blur-bg');
            box.style.backgroundImage = `url('${imgUrl}')`;
            box.style.backgroundSize = 'cover';
            box.style.backgroundPosition = 'center';
            showToast("Virtual background applied");
        }

        function toggleNoiseSuppression() {
            isNoiseFiltered = !isNoiseFiltered;
            const btn = document.getElementById('noise-btn');
            if (isNoiseFiltered) {
                btn.className = "bg-indigo-600 text-white px-2.5 py-1.5 rounded-lg text-xs font-medium transition";
                showToast("Advanced Noise Suppression Active");
            } else {
                btn.className = "bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg text-xs font-medium transition";
                showToast("Noise Suppression Disabled");
            }
        }

        async function toggleScreenShare() {
            try {
                if (!isSharingScreen) {
                    const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                    const videoTrack = screenStream.getVideoTracks()[0];
                    for (let peerId in activePeers) {
                        const sender = activePeers[peerId].peerConnection?.getSenders().find(s => s.track && s.track.kind === 'video');
                        if (sender) sender.replaceTrack(videoTrack);
                    }
                    document.getElementById('local-video').srcObject = screenStream;
                    isSharingScreen = true;
                    document.getElementById('screen-btn').innerText = "💻 Stop";
                    showToast("Screen sharing started");
                    videoTrack.onended = () => stopScreenShare();
                } else {
                    stopScreenShare();
                }
            } catch (err) { console.error(err); }
        }

        function stopScreenShare() {
            if (localStream && localStream.getVideoTracks().length > 0) {
                const videoTrack = localStream.getVideoTracks()[0];
                for (let peerId in activePeers) {
                    const sender = activePeers[peerId].peerConnection?.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (sender) sender.replaceTrack(videoTrack);
                }
                document.getElementById('local-video').srcObject = localStream;
            }
            isSharingScreen = false;
            document.getElementById('screen-btn').innerText = "💻 Share";
            showToast("Screen sharing stopped");
        }

        function toggleRecording() {
            const recBtn = document.getElementById('rec-btn');
            const recBadge = document.getElementById('recording-badge');
            if (!isRecording) {
                recordedChunks = [];
                try {
                    mediaRecorder = new MediaRecorder(localStream, { mimeType: 'video/webm; codecs=vp9' });
                } catch (e) {
                    mediaRecorder = new MediaRecorder(localStream);
                }
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `meeting-record-${Date.now()}.webm`;
                    a.click();
                    showToast("Recording saved!");
                };
                mediaRecorder.start();
                isRecording = true;
                recBtn.className = "bg-red-600 text-white px-2.5 py-1.5 rounded-lg text-xs font-medium transition";
                recBtn.innerText = "⏹️ Stop";
                recBadge.classList.remove('hidden');
                showToast("Recording started");
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recBtn.className = "bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg text-xs font-medium transition";
                recBtn.innerText = "🔴 Rec";
                recBadge.classList.add('hidden');
            }
        }

        function toggleHandRaise() {
            isHandRaised = !isHandRaised;
            document.getElementById('local-hand').classList.toggle('hidden', !isHandRaised);
            showToast(isHandRaised ? "Hand raised" : "Hand lowered");
            if (peer && roomCode) db.ref('rooms/' + roomCode + '/' + peer.id).update({ handRaised: isHandRaised });
        }

        function togglePollModal() {
            document.getElementById('poll-modal').classList.toggle('hidden');
        }

        function publishPoll() {
            const q = document.getElementById('poll-question').value.trim();
            const o1 = document.getElementById('poll-opt1').value.trim();
            const o2 = document.getElementById('poll-opt2').value.trim();
            if (!q || !o1 || !o2) { alert("Fill all poll fields!"); return; }

            db.ref('polls/' + roomCode).set({
                question: q,
                option1: o1,
                option2: o2,
                votes1: 0,
                votes2: 0,
                publisher: userName
            });
            togglePollModal();
            showToast("Poll published live!");
        }

        function listenForPolls() {
            db.ref('polls/' + roomCode).on('value', (snapshot) => {
                const data = snapshot.val();
                const box = document.getElementById('poll-active-box');
                if (data) {
                    box.classList.remove('hidden');
                    document.getElementById('poll-q-display').innerText = `📊 Poll: ${data.question}`;
                    const optBox = document.getElementById('poll-options-box');
                    optBox.innerHTML = `
                        <button onclick="votePoll(1)" class="w-full bg-slate-800 hover:bg-indigo-600 text-left p-2 rounded transition flex justify-between"><span>1. ${escapeHtml(data.option1)}</span> <span class="font-bold text-indigo-400">${data.votes1} votes</span></button>
                        <button onclick="votePoll(2)" class="w-full bg-slate-800 hover:bg-indigo-600 text-left p-2 rounded transition flex justify-between"><span>2. ${escapeHtml(data.option2)}</span> <span class="font-bold text-indigo-400">${data.votes2} votes</span></button>
                    `;
                } else {
                    box.classList.add('hidden');
                }
            });
        }

        function votePoll(optionNum) {
            const pollRef = db.ref('polls/' + roomCode);
            pollRef.transaction((poll) => {
                if (poll) {
                    if (optionNum === 1) poll.votes1++;
                    else poll.votes2++;
                }
                return poll;
            });
            showToast("Vote recorded!");
        }

        function listenForParticipantCount() {
            db.ref('rooms/' + roomCode).on('value', (snapshot) => {
                document.getElementById('participant-badge').innerText = `👥 ${snapshot.numChildren()} Online`;
                snapshot.forEach((childSnap) => {
                    const pId = childSnap.key;
                    const pData = childSnap.val();
                    if (peer && pId !== peer.id) {
                        const handElem = document.getElementById(`remote-hand-${pId}`);
                        if (handElem) handElem.classList.toggle('hidden', !pData.handRaised);
                    }
                });
            });
        }

        function listenForHostActions(myId) {
            db.ref('rooms/' + roomCode + '/' + myId).on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    if (data.forceMute && !isMuted) toggleAudio();
                    if (data.kicked) { alert("Removed by host."); leaveRoom(); }
                }
            });
        }

        function sendReaction(emoji) {
            db.ref('reactions/' + roomCode).push({ emoji: emoji, sender: userName, timestamp: Date.now() });
        }

        function listenForReactions() {
            db.ref('reactions/' + roomCode).on('child_added', (snapshot) => {
                showFloatingEmoji(snapshot.val().emoji);
            });
        }

        function showFloatingEmoji(emoji) {
            const container = document.getElementById('video-grid');
            const span = document.createElement('span');
            span.className = 'floating-emoji';
            span.innerText = emoji;
            span.style.left = `${Math.random() * 80 + 10}%`;
            container.appendChild(span);
            setTimeout(() => span.remove(), 2000);
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            const body = document.getElementById('app-body');
            body.className = isDarkMode ? "bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden transition-colors duration-300" : "bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between overflow-x-hidden transition-colors duration-300";
            document.getElementById('theme-btn').innerText = isDarkMode ? "🌙" : "☀️";
        }

        function listenForPeers() {
            db.ref('rooms/' + roomCode).on('child_added', (snapshot) => {
                const remotePeerId = snapshot.key;
                const peerData = snapshot.val();
                if (remotePeerId !== peer.id && !activePeers[remotePeerId]) {
                    setTimeout(() => {
                        if (localStream) {
                            const call = peer.call(remotePeerId, localStream);
                            handleIncomingCall(call, peerData.name);
                        }
                    }, 500);
                }
            });
            db.ref('rooms/' + roomCode).on('child_removed', (snapshot) => {
                removeRemoteVideo(snapshot.key);
            });
        }

        function handleIncomingCall(call, peerName = "Participant") {
            activePeers[call.peer] = call;
            call.on('stream', (remoteStream) => {
                addRemoteVideo(call.peer, remoteStream, peerName);
            });
            call.on('close', () => removeRemoteVideo(call.peer));
        }

        function addRemoteVideo(peerId, stream, name) {
            let div = document.getElementById(`video-box-${peerId}`);
            if (!div) {
                const grid = document.getElementById('video-grid');
                div = document.createElement('div');
                div.id = `video-box-${peerId}`;
                div.className = "relative bg-slate-800 rounded-2xl overflow-hidden border border-slate-700 aspect-video flex items-center justify-center shadow-inner group";
                div.innerHTML = `
                    <video autoplay playsinline class="w-full h-full object-contain bg-black"></video>
                    <span class="absolute bottom-3 left-3 bg-black/60 backdrop-blur-md text-white text-xs px-2.5 py-1 rounded-md font-medium">${escapeHtml(name)}</span>
                    <span id="remote-hand-${peerId}" class="absolute top-3 right-3 text-xl hidden">✋</span>
                `;
                grid.appendChild(div);
            }
            const videoElem = div.querySelector('video');
            if (videoElem.srcObject !== stream) {
                videoElem.srcObject = stream;
                videoElem.play().catch(e => console.log(e));
            }
        }

        function removeRemoteVideo(peerId) {
            const box = document.getElementById(`video-box-${peerId}`);
            if (box) box.remove();
            delete activePeers[peerId];
        }

        function copyInviteLink() {
            const inviteUrl = window.location.href.split('?')[0] + `?room=${roomCode}`;
            navigator.clipboard.writeText(inviteUrl);
            showToast("Invite link copied!");
        }

        function toggleChatDrawer() {
            document.getElementById('chat-drawer').classList.toggle('hidden');
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            db.ref('chats/' + roomCode).push({ sender: userName, text: text, timestamp: Date.now() });
            input.value = "";
        }

        function handleChatKey(e) { if (e.key === 'Enter') sendChatMessage(); }

        function listenForChat() {
            db.ref('chats/' + roomCode).on('child_added', (snapshot) => {
                appendChatMessage(snapshot.val());
            });
        }

        function appendChatMessage(msg) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = "flex flex-col bg-slate-900/50 p-2 rounded-lg border border-slate-700/50";
            div.innerHTML = `
                <div class="flex justify-between text-[10px] text-indigo-400 font-semibold mb-0.5">
                    <span>${escapeHtml(msg.sender)}</span>
                    <span class="text-slate-500">${new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                </div>
                <p class="text-slate-200 break-words">${escapeHtml(msg.text)}</p>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        let isMuted = false;
        function toggleAudio() {
            if (!localStream) return;
            isMuted = !isMuted;
            localStream.getAudioTracks()[0].enabled = !isMuted;
            document.getElementById('audio-btn').innerText = isMuted ? "🎤 Unmute" : "🎤 Mute";
            document.getElementById('audio-btn').className = isMuted ? "bg-red-600 text-white px-2.5 py-1.5 rounded-lg text-xs font-medium transition" : "bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg text-xs font-medium transition";
        }

        let isVideoOff = false;
        function toggleVideo() {
            if (!localStream) return;
            isVideoOff = !isVideoOff;
            localStream.getVideoTracks()[0].enabled = !isVideoOff;
            document.getElementById('video-btn').innerText = isVideoOff ? "📷 Cam Off" : "📷 Cam";
            document.getElementById('video-btn').className = isVideoOff ? "bg-red-600 text-white px-2.5 py-1.5 rounded-lg text-xs font-medium transition" : "bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg text-xs font-medium transition";
        }

        function leaveRoom() {
            if (peer) {
                db.ref('rooms/' + roomCode + '/' + peer.id).remove();
                peer.destroy();
            }
            if (callTimerInterval) clearInterval(callTimerInterval);
            window.location.reload();
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
