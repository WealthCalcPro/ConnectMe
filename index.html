<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectMe Pro - Enterprise Grade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        @keyframes floatUp {
            0% { transform: translateY(0px) scale(0.8); opacity: 1; }
            100% { transform: translateY(-180px) scale(1.4); opacity: 0; }
        }
        .floating-emoji {
            animation: floatUp 2s ease-out forwards;
            pointer-events: none;
            position: absolute;
            bottom: 20px;
            z-index: 50;
            font-size: 2rem;
        }
        .blur-bg {
            filter: blur(12px);
            transform: scale(1.1);
        }
    </style>
</head>
<body id="app-body" class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden transition-colors duration-300">

    <div id="toast" class="fixed top-5 right-5 z-50 transform translate-x-full transition-transform duration-300 bg-indigo-600 text-white text-xs px-4 py-2.5 rounded-xl shadow-xl flex items-center gap-2">
        <span id="toast-msg">Link copied!</span>
    </div>

    <div id="home-screen" class="flex-1 flex items-center justify-center p-4">
        <div id="home-card" class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-8 shadow-2xl transition-colors duration-300">
            <div class="text-center mb-6">
                <div class="text-4xl mb-2">🚀</div>
                <h1 class="text-2xl font-bold tracking-tight">ConnectMe Enterprise</h1>
                <p class="text-xs text-slate-400 mt-1">Virtual BG, Password Rooms, Polls & Noise Filter</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Your Name</label>
                    <input type="text" id="user-name-input" placeholder="e.g. Rahul" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-100">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Room Code / ID</label>
                    <input type="text" id="room-code-input" placeholder="e.g. board-meeting" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-100 uppercase tracking-wider font-mono">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Room Password (Optional)</label>
                    <input type="password" id="room-pass-input" placeholder="4-digit PIN or password" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-100">
                </div>
                <button onclick="joinRoom()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg py-2.5 text-sm transition shadow-lg shadow-indigo-600/30">
                    Secure Join Room
                </button>
            </div>
        </div>
    </div>

    <div id="pass-modal" class="hidden fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl">
            <h3 class="font-bold text-base mb-2">Room is Password Protected</h3>
            <p class="text-xs text-slate-400 mb-4">Enter room PIN/password to join.</p>
            <input type="password" id="modal-pass-input" placeholder="Enter password" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm mb-4 text-center text-slate-100">
            <div class="flex gap-2">
                <button onclick="verifyAndJoin()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-lg text-xs font-medium">Verify & Join</button>
                <button onclick="cancelPassword()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-300 py-2 rounded-lg text-xs font-medium">Cancel</button>
            </div>
        </div>
    </div>

    <div id="poll-modal" class="hidden fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl">
            <h3 class="font-bold text-sm mb-3">Create Live Poll</h3>
            <div class="space-y-3 mb-4">
                <input type="text" id="poll-question" placeholder="Ask a question..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100">
                <input type="text" id="poll-opt1" placeholder="Option A" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100">
                <input type="text" id="poll-opt2" placeholder="Option B" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100">
            </div>
            <div class="flex gap-2">
                <button onclick="publishPoll()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-lg text-xs font-medium">Publish Poll</button>
                <button onclick="togglePollModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-300 py-2 rounded-lg text-xs font-medium">Close</button>
            </div>
        </div>
    </div>

    <div id="call-screen" class="hidden flex-1 flex flex-col h-screen p-4 max-w-7xl mx-auto w-full">
        <div id="top-bar" class="flex flex-wrap justify-between items-center bg-slate-800 px-4 py-3 rounded-xl mb-4 border border-slate-700 shadow-md gap-3 transition-colors duration-300">
            <div class="flex items-center gap-3">
                <div>
                    <h2 id="display-room-title" class="font-bold text-sm text-indigo-400">Room: --</h2>
                    <p id="call-timer" class="text-xs text-slate-400 font-mono">⏱️ 00:00</p>
                </div>
                <span id="participant-badge" class="bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 text-xs px-2.5 py-1 rounded-full font-medium">👥 1 Online</span>
                <span id="recording-badge" class="hidden bg-red-600/20 text-red-400 border border-red-500/30 text-xs px-2 py-0.5 rounded-full font-medium animate-pulse">🔴 REC</span>
            </div>
            
            <div class="flex items-center flex-wrap gap-1.5">
                <button onclick="copyInviteLink()" class="bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 border border-indigo-500/30 px-2.5 py-1.5 rounded-lg text-xs font-medium transition">📋 Invite</button>
                <button onclick="toggleAudio()" id="audio-btn" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg text-xs font-medium transition">🎤 Mute</button>
                <button onclick="toggleVideo()" id="video-btn" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg text-xs font-medium transition">📷 Cam</button>
                <button onclick="flipCamera()" id="flip-btn" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg text-xs font-medium transition">🔄 Flip</button>
                <button onclick="toggleVirtualBlur()" id="blur-btn" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg text-xs font-medium transition">✨ Blur</button>
                <button onclick="setVirtualBg('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=800')" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg text-xs font-medium transition">🌅 BG</button>
                <button onclick="toggleNoiseSuppression()" id="noise-btn" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg text-xs font-medium transition">🔊 Noise Filter</button>
                <button onclick="toggleScreenShare()" id="screen-btn" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg text-xs font-medium transition">💻 Share</button>
                <button onclick="toggleRecording()" id="rec-btn" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg text-xs font-medium transition">🔴 Rec</button>
                <button onclick="toggleHandRaise()" id="hand-btn" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg text-xs font-medium transition">✋ Hand</button>
                <button onclick="togglePollModal()" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg text-xs font-medium transition">📊 Poll</button>
                <button onclick="toggleChatDrawer()" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg text-xs font-medium transition">💬 Chat</button>
                <button onclick="toggleTheme()" id="theme-btn" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg text-xs font-medium transition">🌙</button>
                <button onclick="leaveRoom()" class="bg-red-600 hover:bg-red-500 text-white px-2.5 py-1.5 rounded-lg text-xs font-medium transition">Leave</button>
            </div>
        </div>

        <div class="flex-1 flex gap-4 overflow-hidden relative">
            <div id="video-grid" class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4 items-center justify-center overflow-y-auto content-center relative">
                <div id="local-box" class="relative bg-slate-800 rounded-2xl overflow-hidden border border-slate-700 aspect-video flex items-center justify-center shadow-inner">
                    <video id="local-video" autoplay muted playsinline class="w-full h-full object-contain transform -scale-x-100 bg-black"></video>
                    <span id="local-label" class="absolute bottom-3 left-3 bg-black/60 backdrop-blur-md text-white text-xs px-2.5 py-1 rounded-md font-medium">You</span>
                    <span id="local-hand" class="absolute top-3 right-3 text-xl hidden">✋</span>
                </div>
            </div>

            <div id="reaction-container" class="absolute bottom-6 left-6 flex gap-2 bg-slate-800/80 backdrop-blur-md p-2 rounded-xl border border-slate-700 shadow-lg z-40">
                <button onclick="sendReaction('❤️')" class="hover:scale-125 transition text-lg">❤️</button>
                <button onclick="sendReaction('😂')" class="hover:scale-125 transition text-lg">😂</button>
                <button onclick="sendReaction('👍')" class="hover:scale-125 transition text-lg">👍</button>
                <button onclick="sendReaction('👏')" class="hover:scale-125 transition text-lg">👏</button>
                <button onclick="sendReaction('🔥')" class="hover:scale-125 transition text-lg">🔥</button>
            </div>

            <div id="chat-drawer" class="hidden w-80 bg-slate-800 border border-slate-700 rounded-2xl flex flex-col overflow-hidden shadow-xl transition-colors duration-300">
                <div class="bg-slate-700/50 p-3 border-b border-slate-700 flex justify-between items-center">
                    <h3 class="font-bold text-xs text-slate-200">Room Chat & Live Polls</h3>
                    <button onclick="toggleChatDrawer()" class="text-slate-400 hover:text-white text-xs">✕</button>
                </div>
                <div id="poll-active-box" class="hidden p-3 bg-indigo-950/50 border-b border-slate-700 text-xs">
                    <p id="poll-q-display" class="font-bold text-indigo-300 mb-2"></p>
                    <div id="poll-options-box" class="space-y-1.5"></div>
                </div>
                <div id="chat-messages" class="flex-1 p-3 overflow-y-auto space-y-2 text-xs"></div>
                <div class="p-2.5 border-t border-slate-700 flex gap-2">
                    <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="handleChatKey(event)" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500 text-slate-100">
                    <button onclick="sendChatMessage()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-lg text-xs font-medium">Send</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-3 text-xs text-slate-500 border-t border-slate-800 transition-colors duration-300">
        ConnectMe Enterprise Video Platform &copy; 2026
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCogqoa3XULwSYW46AGNkpWWuu2K4JZdoI",
            authDomain: "vaultchatapp-65e05.firebaseapp.com",
            databaseURL: "https://vaultchatapp-65e05-default-rtdb.firebaseio.com",
            projectId: "vaultchatapp-65e05",
            storageBucket: "vaultchatapp-65e05.firebasestorage.app",
            messagingSenderId: "598529835602",
            appId: "1:598529835602:web:d6e58dd829b4294a64958b"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let localStream = null;
        let peer = null;
        let roomCode = "";
        let userName = "";
        let roomPassword = "";
        let activePeers = {};
        let useFrontCamera = true;
        let callTimerInterval = null;
        let secondsElapsed = 0;
        let isHandRaised = false;
        let isDarkMode = true;
        let isBlurred = false;
        let isNoiseFiltered = false;
        let audioCtx = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let isHost = false;
        let isSharingScreen = false;

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('translate-x-full');
            setTimeout(() => {
                toast.classList.add('translate-x-full');
            }, 3000);
        }

        async function initMedia(facingMode = 'user') {
            try {
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                }
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: facingMode }, 
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } 
                });
                document.getElementById('local-video').srcObject = localStream;
            } catch (err) {
                console.error("Media access error:", err);
            }
        }
        initMedia();

        async function joinRoom() {
            userName = document.getElementById('user-name-input').value.trim();
            roomCode = document.getElementById('room-code-input').value.trim().toLowerCase();
            roomPassword = document.getElementById('room-pass-input').value.trim();

            if (!userName || !roomCode) {
                alert("Please enter both your name and a room code!");
                return;
            }

            db.ref('roomMeta/' + roomCode).once('value', (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    if (data.password && data.password !== roomPassword) {
                        document.getElementById('pass-modal').classList.remove('hidden');
                        return;
                    }
                } else {
                    if (roomPassword) {
                        db.ref('roomMeta/' + roomCode).set({ password: roomPassword });
                    }
                }
                proceedToCall();
            });
        }

        function verifyAndJoin() {
            const enteredPass = document.getElementById('modal-pass-input').value.trim();
            db.ref('roomMeta/' + roomCode + '/password').once('value', (snapshot) => {
                if (snapshot.val() === enteredPass) {
                    document.getElementById('pass-modal').classList.add('hidden');
                    proceedToCall();
                } else {
                    alert("Incorrect Room Password!");
                }
            });
        }

        function cancelPassword() {
            document.getElementById('pass-modal').classList.add('hidden');
        }

        function proceedToCall() {
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('call-screen').classList.remove('hidden');
            document.getElementById('display-room-title').innerText = `Room: ${roomCode.toUpperCase()}`;
            document.getElementById('local-label').innerText = `${userName} (You)`;

            startCallTimer();

            db.ref('rooms/' + roomCode).once('value', (snapshot) => {
                if (!snapshot.exists()) isHost = true;
            });

            peer = new Peer();

            peer.
