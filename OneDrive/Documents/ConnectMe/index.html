<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectMe - Video Meeting</title>
    <!-- Tailwind CSS for modern UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- PeerJS for WebRTC connection -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between p-4">

    <!-- Home/Lobby Screen -->
    <div id="home-screen" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-8 shadow-2xl space-y-6 text-center">
            <h1 class="text-3xl font-bold text-indigo-400">ConnectMe Meetings</h1>
            <p class="text-slate-400 text-sm">Start a secure video call instantly like Zoom or WhatsApp.</p>
            
            <div class="space-y-4">
                <button onclick="createRoom()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition shadow-lg">
                    Create New Meeting
                </button>
                <div class="flex gap-2">
                    <input type="text" id="room-input" placeholder="Enter Room Code" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500">
                    <button onclick="joinRoom()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-6 py-3 rounded-xl transition">
                        Join
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Video Call Screen (Hidden by default) -->
    <div id="call-screen" class="hidden flex-1 flex flex-col h-screen p-4 max-w-6xl mx-auto w-full">
        <!-- Top Bar -->
        <div class="flex justify-between items-center bg-slate-800 px-4 py-3 rounded-xl mb-4 border border-slate-700">
            <div>
                <h2 id="display-room-title" class="font-bold text-sm text-indigo-400">Room: --</h2>
                <p id="display-peer-status" class="text-xs text-slate-400">Connecting to room...</p>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="toggleAudio()" id="audio-btn" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm font-medium transition">Mute</button>
                <button onclick="toggleVideo()" id="video-btn" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm font-medium transition">Stop Cam</button>
                <button onclick="leaveCall()" class="bg-rose-600 hover:bg-rose-500 px-4 py-2 rounded-lg text-sm font-medium transition">Leave</button>
            </div>
        </div>

        <!-- Video Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-1 h-[70vh]">
            <div class="relative bg-slate-800 rounded-2xl overflow-hidden border border-slate-700 flex items-center justify-center">
                <video id="local-video" autoplay muted playsinline class="w-full h-full object-cover"></video>
                <span class="absolute bottom-3 left-3 bg-slate-900/80 px-3 py-1 rounded-lg text-xs font-medium">You</span>
            </div>
            <div class="relative bg-slate-800 rounded-2xl overflow-hidden border border-slate-700 flex items-center justify-center">
                <video id="remote-video" autoplay playsinline class="w-full h-full object-cover"></video>
                <div id="waiting-placeholder" class="absolute inset-flex flex-col items-center justify-center text-slate-400">
                    <p class="text-sm font-medium">Waiting for other participant to join...</p>
                </div>
                <span class="absolute bottom-3 left-3 bg-slate-900/80 px-3 py-1 rounded-lg text-xs font-medium">Participant</span>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        // Firebase Configuration (Apna Firebase Project config yahan daalna hai)
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let localStream;
        let peer;
        let roomCode;
        let myPeerId;

        // Media Stream access karna (Camera & Mic)
        async function startCamera() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('local-video').srcObject = localStream;
            } catch (error) {
                alert("Camera or Microphone access denied!");
            }
        }

        async function createRoom() {
            await startCamera();
            roomCode = Math.random().toString(36.substring(2, 8)).toUpperCase();
            
            // PeerJS connection setup
            peer = new Peer();
            peer.on('open', (id) => {
                myPeerId = id;
                // Firebase me room create karo
                db.ref('rooms/' + roomCode).set({ host: myPeerId });
                
                document.getElementById('home-screen').classList.add('hidden');
                document.getElementById('call-screen').classList.remove('hidden');
                document.getElementById('display-room-title').innerText = `Room Code: ${roomCode}`;
                document.getElementById('display-peer-status').innerText = "Share this code with your friend!";
            });

            // Dusre user ka call receive karna
            peer.on('call', (call) => {
                call.answer(localStream);
                call.on('stream', (remoteStream) => {
                    document.getElementById('remote-video').srcObject = remoteStream;
                    document.getElementById('waiting-placeholder').classList.add('hidden');
                    document.getElementById('display-peer-status').innerText = "Connected";
                });
            });
        }

        async function joinRoom() {
            roomCode = document.getElementById('room-input').value.trim().toUpperCase();
            if (!roomCode) {
                alert("Please enter a valid room code!");
                return;
            }

            await startCamera();
            peer = new Peer();
            
            peer.on('open', (id) => {
                myPeerId = id;
                
                // Firebase se host ki ID fetch karna
                db.ref('rooms/' + roomCode).once('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data && data.host) {
                        const hostPeerId = data.host;
                        
                        document.getElementById('home-screen').classList.add('hidden');
                        document.getElementById('call-screen').classList.remove('hidden');
                        document.getElementById('display-room-title').innerText = `Room Code: ${roomCode}`;
                        document.getElementById('display-peer-status').innerText = "Connecting to call...";

                        // Host ko call lagana
                        const call = peer.call(hostPeerId, localStream);
                        call.on('stream', (remoteStream) => {
                            document.getElementById('remote-video').srcObject = remoteStream;
                            document.getElementById('waiting-placeholder').classList.add('hidden');
                            document.getElementById('display-peer-status').innerText = "Connected";
                        });
                    } else {
                        alert("Room not found!");
                    }
                });
            });
        }

        function toggleAudio() {
            const audioTrack = localStream.getAudioTracks()[0];
            audioTrack.enabled = !audioTrack.enabled;
            document.getElementById('audio-btn').innerText = audioTrack.enabled ? "Mute" : "Unmute";
        }

        function toggleVideo() {
            const videoTrack = localStream.getVideoTracks()[0];
            videoTrack.enabled = !videoTrack.enabled;
            document.getElementById('video-btn').innerText = videoTrack.enabled ? "Stop Cam" : "Start Cam";
        }

        function leaveCall() {
            if(localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            if(peer) peer.destroy();
            window.location.reload();
        }
    </script>
</body>
</html>
